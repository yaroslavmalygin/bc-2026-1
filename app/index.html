<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!--
  Механизм исключения из поиска — именно этот мета-тег.
  robots.txt с Disallow здесь был бы вреден: краулер, которому запрещён обход,
  не читает страницу и не видит noindex, поэтому URL всё равно может попасть
  в индекс по внешней ссылке. Обход разрешён, из выдачи выпадаем тегом.
-->
<meta name="robots" content="noindex, nofollow">

<title>Календарь</title>
<meta name="description" content="Персональный календарь на каждый день">

<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131520" media="(prefers-color-scheme: dark)">

<!-- Обе меты нужны: старая для iOS, новая — текущий стандарт.
     Без них iOS ставит на домашний экран скриншот страницы вместо иконки. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Календарь">

<!-- Пути везде относительные: сайт живёт не в корне домена, а в каталоге
     репозитория, и абсолютный путь увёл бы на username.github.io -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- Шапка -->
  <header class="topbar">
    <div class="bar-date">
      <div class="bar-dow" id="barDow">&nbsp;</div>
      <div class="bar-day" id="barDay">&nbsp;</div>
    </div>
    <div class="bar-actions">
      <button class="pill-today" id="todayBtn" type="button">Сегодня</button>
      <button class="icon-btn" id="calBtn" type="button" aria-label="Выбрать дату">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </button>
      <button class="icon-btn" id="legBtn" type="button" aria-label="Легенда и о календаре">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".9" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <!-- Плашки состояния: предварительные данные, край диапазона, обновление -->
  <div class="banners" id="banners"></div>

  <!-- Лунная полоса -->
  <section class="moonbar" id="moonbar" aria-live="polite">
    <svg class="moon-disc" id="moonDisc" aria-hidden="true"></svg>
    <div class="moon-copy">
      <div class="moon-title" id="moonTitle">&nbsp;</div>
      <div class="moon-sub" id="moonSub">&nbsp;</div>
    </div>
  </section>

  <!-- Колода дней -->
  <main class="deck" id="deck" aria-label="Дни календаря"></main>

  <!-- Нижняя панель -->
  <nav class="bottombar">
    <button class="nav-btn" id="prevBtn" type="button" aria-label="Предыдущий день">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="fc-btn" id="fcBtn" type="button">
      <svg class="fc-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8.5 13h7M8.5 17h4"/></svg>
      <span class="fc-label" id="fcLabel">Прогноз на месяц</span>
      <svg class="fc-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
    </button>
    <button class="nav-btn" id="nextBtn" type="button" aria-label="Следующий день">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>

  <div class="scrim" id="scrim"></div>

  <!-- Шторка: легенда -->
  <section class="sheet" id="sheetLegend" role="dialog" aria-modal="true"
           aria-labelledby="legendTitle" hidden>
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="legendTitle">Легенда</h2>
      <button class="icon-btn" data-close type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="legendBody"></div>
  </section>

  <!-- Шторка: выбор даты -->
  <section class="sheet" id="sheetCal" role="dialog" aria-modal="true"
           aria-labelledby="calTitle" hidden>
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="calTitle">Выбрать день</h2>
      <button class="icon-btn" data-close type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="cal-nav">
        <button class="nav-btn" id="calPrev" type="button" aria-label="Предыдущий месяц">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="cal-month" id="calMonth"></div>
        <button class="nav-btn" id="calNext" type="button" aria-label="Следующий месяц">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><i class="cal-dot cal-dot-today"></i> сегодня</span>
        <span><i class="cal-dot cal-dot-moon"></i> новолуние или полнолуние</span>
        <span><i class="cal-dot cal-dot-empty"></i> нет данных</span>
      </div>
    </div>
  </section>

  <!-- Шторка: прогноз на месяц -->
  <section class="sheet" id="sheetForecast" role="dialog" aria-modal="true"
           aria-labelledby="fcTitle" hidden>
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="fcTitle">Прогноз</h2>
      <button class="icon-btn" data-close type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body"><p class="prose" id="fcBody"></p></div>
  </section>

  <!-- Шторка: подробности строки -->
  <section class="sheet" id="sheetDetail" role="dialog" aria-modal="true"
           aria-labelledby="dtTitle" hidden>
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="dtTitle">Подробности</h2>
      <button class="icon-btn" data-close type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="dtBody"></div>
  </section>

  <!-- Просьба повернуть телефон. Календарь в landscape не перестраивается. -->
  <div class="rotate-overlay" id="rotateOverlay">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="7" y="2" width="10" height="20" rx="2"/>
      <path d="M10 5.5h4"/>
    </svg>
    <p>Поверните телефон вертикально</p>
  </div>

  <!-- Экраны состояния поверх всего -->
  <div class="curtain" id="curtain">
    <div class="curtain-inner">
      <div class="curtain-icon" id="curtainIcon"></div>
      <h1 class="curtain-title" id="curtainTitle">Загрузка</h1>
      <p class="curtain-text" id="curtainText"></p>
      <button class="curtain-btn" id="curtainBtn" type="button" hidden>Обновить</button>
    </div>
  </div>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
